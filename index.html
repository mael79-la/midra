<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- ===== PWA META TAGS ===== -->
  <meta name="application-name" content="Dragon Dash">
  <meta name="description" content="Esquiva obstáculos con tu dragón en un mundo 3D lleno de magia">
  <meta name="theme-color" content="#06061c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dragon Dash">
  <meta name="msapplication-TileColor" content="#06061c">
  <meta name="msapplication-TileImage" content="icons/icon-144x144.png">

  <!-- ===== FAVICON ===== -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="shortcut icon" href="icons/favicon-32x32.png">

  <!-- ===== APPLE TOUCH ICONS ===== -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">

  <!-- ===== PWA MANIFEST ===== -->
  <link rel="manifest" href="manifest.json">

  <title>Dragon Dash 🐉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-overlay">

    <!-- HUD durante el juego -->
    <div id="hud" class="hidden">
      <div id="score-box">
        <div class="hud-label">PUNTOS</div>
        <div id="score">0</div>
      </div>
      <div id="lives-box">
        <span id="lives-display">❤️❤️❤️</span>
      </div>
      <button id="btn-pause-game">⏸</button>
    </div>

    <!-- Power-up timer -->
    <div id="powerup-hud" class="hidden">
      <span id="powerup-icon-hud"></span>
      <div id="powerup-bar"><div id="powerup-bar-fill"></div></div>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <div id="screen-menu">
      <div class="logo">
        <img src="icons/icon-128x128.png" alt="Dragon Dash" class="logo-img">
        <h1>DRAGON DASH</h1>
        <p>Esquiva todos los obstáculos</p>
      </div>
      <div class="controls-info">
        <div class="ctrl">⬆️⬇️ Flechas del teclado / W·S</div>
        <div class="ctrl">📱 Toca la mitad superior o inferior</div>
      </div>
      <div id="difficulty-buttons">
        <button class="diff-btn selected" data-diff="normal">⚔️ Normal</button>
        <button class="diff-btn" data-diff="hard">🔥 Difícil</button>
        <button class="diff-btn" data-diff="hell">💀 Infierno</button>
      </div>
      <button id="btn-start" class="btn-main">▶ COMENZAR</button>
      <div id="best-score-display">🏆 Récord: <strong id="best-score-val">0</strong></div>
    </div>

    <!-- PAUSA -->
    <div id="screen-pause" class="hidden">
      <img src="icons/icon-96x96.png" alt="" class="pause-icon">
      <h2>⏸ PAUSA</h2>
      <button id="btn-resume" class="btn-main">▶ CONTINUAR</button>
      <button id="btn-pause-quit" class="btn-sec">🏠 MENÚ</button>
    </div>

    <!-- GAME OVER -->
    <div id="screen-gameover" class="hidden">
      <img src="icons/icon-128x128.png" alt="" class="go-icon-img">
      <h2>JUEGO TERMINADO</h2>
      <div class="go-scores">
        <div>Puntuación: <strong id="go-score">0</strong></div>
        <div>Récord: <strong id="go-best">0</strong></div>
      </div>
      <button id="btn-retry" class="btn-main">🔄 INTENTAR DE NUEVO</button>
      <button id="btn-go-menu" class="btn-sec">🏠 MENÚ</button>
    </div>

  </div>

  <!-- Mensaje flotante -->
  <div id="popup-msg"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="game.js"></script>

  <!-- ===== SERVICE WORKER ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/midra/sw.js', { scope: '/midra/' })
          .then(reg => console.log('[SW] Registrado:', reg.scope))
          .catch(err => console.warn('[SW] Error:', err));
      });
    }
  </script>
</body>
</html>
